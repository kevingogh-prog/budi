:root{
--bg:#F3F6F2; --card:#FFFFFF; --ink:#14302A; --muted:#5A6D65; --line:#D6E1D9;
--brand:#1E6B4A; --brand-ink:#FFFFFF; --brand-soft:#E2EEE6; --sun:#E9A93A; --sun-ink:#14302A; --sun-soft:#FBEFD5;
--bubble-ai:#FFFFFF; --bubble-me:#1E6B4A; --bubble-me-ink:#FFFFFF; --danger:#A8402D;
--display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
--body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
--r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#0E1B17; --card:#15261F; --ink:#E6EFE9; --muted:#9DB1A7; --line:#2A3F36;
--brand:#4FB585; --brand-ink:#0E1B17; --brand-soft:#1C3A2E; --sun:#F0BD5E; --sun-ink:#14302A; --sun-soft:#3A2F18;
--bubble-ai:#15261F; --bubble-me:#2F8A61; --bubble-me-ink:#FFFFFF; --danger:#E58A76; color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0E1B17; --card:#15261F; --ink:#E6EFE9; --muted:#9DB1A7; --line:#2A3F36;
--brand:#4FB585; --brand-ink:#0E1B17; --brand-soft:#1C3A2E; --sun:#F0BD5E; --sun-ink:#14302A; --sun-soft:#3A2F18;
--bubble-ai:#15261F; --bubble-me:#2F8A61; --bubble-me-ink:#FFFFFF; --danger:#E58A76; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--brand)}
.dots{display:inline-flex}.dots i{width:14px;height:14px;border-radius:50%;display:block;background:var(--brand)}
.dots i+i{background:var(--sun);margin-left:-5px;box-shadow:0 0 0 2px var(--bg)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pill.off{background:var(--sun-soft);color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:34px;color:var(--brand)} h2{font-size:23px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:16px;cursor:pointer;background:var(--brand);color:var(--brand-ink);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;cursor:pointer;font-size:14px}
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sun-soft);color:var(--ink)}
.chat{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-block:4px 8px;min-height:240px}
.b{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.ai{background:var(--bubble-ai);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.b.me{background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:5px;align-self:flex-end}
.b.typing{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.compose{display:flex;gap:8px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(4px + env(safe-area-inset-bottom,0px))}
.compose input{flex:1;min-width:0;font:inherit;padding:13px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.icon{flex:none;width:48px;height:48px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon.send{background:var(--brand);color:var(--brand-ink)}
.icon.mic{background:var(--sun);color:var(--sun-ink)}
.hint{font-size:12.5px;color:var(--muted);text-align:center}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px 12px;align-items:baseline}
.kv dt{color:var(--muted);font-size:14px}.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.av{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:30px;background:var(--sun-soft);color:var(--brand);flex:none}
.av.sm{width:34px;height:34px;font-size:15px}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.score{font-family:var(--display);font-weight:800;font-size:28px;color:var(--brand);font-variant-numeric:tabular-nums}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid var(--brand-soft);border-top-color:var(--brand);animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chip{padding:8px 0;text-align:center}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
label.f input,label.f select{font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.today{background:var(--sun-soft);border-color:transparent}
.week{display:grid;grid-template-columns:62px repeat(7,1fr);gap:6px 4px;align-items:center;font-size:12px}
.week .d{text-align:center;color:var(--muted);font-weight:600}
.week .who{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:22px;height:22px;border-radius:50%;margin:0 auto;border:2px solid var(--line)}
.dot.on{background:var(--brand);border-color:var(--brand)}
.dot.skip{background:var(--line)}
.dot.today{box-shadow:0 0 0 2px var(--sun)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.note{font-size:12.5px;color:var(--muted);line-height:1.4}
.big{font-family:var(--display);font-weight:800;font-size:30px;color:var(--brand);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
